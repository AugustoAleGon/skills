name: Validate skills
on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify npx installation for Claude Code, Codex, and Cursor
        run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate.py
      - run: python3 skills/uxaudit/scripts/validate_checks.py
      - run: python3 skills/uxaudit/scripts/test_checks.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for script in Path('skills').rglob('*.mjs'):
              subprocess.run(['node', '--check', str(script)], check=True)
          PY
